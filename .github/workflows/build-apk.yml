name: Build GHOST-COPY APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack Project ZIP (for mobile uploads)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Upload GHOST-COPY-Android-Studio-Project.zip to this repository first."
              exit 1
            fi
            unzip -o "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle & Build Debug APK
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload GHOST-COPY APK
        uses: actions/upload-artifact@v4
        with:
          name: GHOST-COPY-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
